name: Feature request
description: Suggest a change or a new feature. Agree on it here before writing code.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: build
    attributes:
      label: Would you like to build it?
      options:
        - "No, just suggesting"
        - "Yes, after the idea is agreed"
    validations:
      required: true
